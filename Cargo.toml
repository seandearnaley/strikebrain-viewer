[workspace]
resolver = "3"
members = ["crates/explorer", "crates/viewer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
gpui-kit = { version = "=0.10.0", features = ["syntect"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = "limited"
split-debuginfo = "unpacked"

# Every dependency runs optimized; our own crates stay in debug.
[profile.dev.package."*"]
opt-level = 3
