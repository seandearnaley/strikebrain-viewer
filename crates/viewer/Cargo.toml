[package]
name = "viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A native viewer for folders of text and images."
publish.workspace = true

[[bin]]
name = "strikebrain-viewer"
path = "src/main.rs"

[dependencies]
# The platform's config folder for the saved state.
# Decodes the image in a Markdown `data:` URL, as the Kit does until the
# Markdown view sets its own image source. The Kit already builds this crate.
data-url = "0.3.2"
directories = "6.0.0"
explorer = { path = "../explorer" }
# The channel that carries the file watcher's events from its thread into a
# GPUI task: GPUI exposes no async channel of its own, and GPUI already
# builds this crate, so it adds no code.
futures = { version = "0.3.34", default-features = false, features = ["std"] }
gpui-kit = { workspace = true }
# The gallery's thumbnails: a picture decoded and scaled down to its tile,
# as a GPUI image (`RenderImage` holds `image::Frame`s). GPUI's own loader
# decodes at full size and keeps the result. GPUI already builds this crate
# with these formats, so listing it adds no crate; the viewer compiles a few
# more of its generic functions (scaling, turning, RGBA). Tests and shots
# also write PNG, JPEG and GIF files with it.
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
# Live refresh. The 150 ms window runs on GPUI's timer, which tests drive,
# so neither debouncer crate is used.
notify = "9.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# `O_NONBLOCK`, so the stage's open of a file never waits on a FIFO. The
# standard library takes the flag but does not name it; GPUI already builds
# this crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# The resource compiler, for the executable's icon and version details.
# GPUI already builds this crate for its own manifest.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
# Refresh and Show ignored tests scan real folders.
tempfile = "3.27.0"

# `just shot`: renders key states offscreen to target/shots/*.png. Not a test
# suite, so `cargo test` and nextest skip it.
[[test]]
name = "shots"
path = "tests/shots.rs"
harness = false
test = false

# `just icon`: draws bundle/icon.png, the source of the bundle's icon. Not a
# test suite either.
[[test]]
name = "icon"
path = "tests/icon.rs"
harness = false
test = false

[lints]
workspace = true
