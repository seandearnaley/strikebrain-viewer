[package]
name = "explorer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The file tree engine behind Strikebrain Viewer: scan, filter, sort and select."
publish.workspace = true

[dependencies]
fixedbitset = "0.5.9"
icu_collator = "2.4.0"
ignore = "0.4.35"
memchr = "2.8.3"

[dev-dependencies]
# Benchmarks only; no plots, no rayon.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12.0"
tempfile = "3.27.0"

# Run with `just bench`; not part of `just check`.
[[bench]]
name = "engine"
harness = false

[lints]
workspace = true
