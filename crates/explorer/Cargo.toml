[package]
name = "explorer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The file tree engine behind Strikebrain Viewer: scan, filter, sort and select."
publish.workspace = true

[dependencies]
fixedbitset = "0.5.9"
icu_collator = "2.4.0"
ignore = "0.4.35"
memchr = "2.8.3"

# Canonical paths without the `\\?\` prefix Windows' own canonicalize adds
# (see `canonical`). GPUI's Windows backend already builds this crate, so it
# adds none; std has no way to drop the prefix only where that is safe.
[target.'cfg(windows)'.dependencies]
dunce = "1.0.5"

# Persistent listings on macOS SMB volumes. rustix provides safe directory
# descriptor and mount queries. These crates already ship with the viewer.
[target.'cfg(target_os = "macos")'.dependencies]
dfdu-sys = "0.6.0"
log = "0.4.35"
rustix = { version = "1.1.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.2", default-features = false }
tempfile = "3.27.0"

[dev-dependencies]
# Benchmarks only; no plots, no rayon.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12.0"
tempfile = "3.27.0"

# Run with `just bench`; not part of `just check`.
[[bench]]
name = "engine"
harness = false

[lints]
workspace = true
