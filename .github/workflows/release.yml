# Builds what a release ships: a macOS disk image, Linux packages and
# Windows packages.
#
# A tag `v<version>` builds them, attests where they were built and puts
# them on a draft GitHub release, which a person publishes. A pull request
# that touches the packaging builds them too, as a rehearsal: nothing is
# signed with a certificate or released, and the files are kept as the
# run's artifacts.
#
# macOS signs with a Developer ID certificate and notarizes when these
# repository secrets exist, and otherwise signs ad hoc, for local use only:
#   APPLE_CERTIFICATE           the Developer ID Application certificate
#                               and its key, a .p12 file, base64
#   APPLE_CERTIFICATE_PASSWORD  that file's password
#   APPLE_API_KEY               an App Store Connect API key, a .p8 file,
#                               base64
#   APPLE_API_KEY_ID            the key's id
#   APPLE_API_ISSUER            the key's issuer id
#
# Windows signs with Azure Artifact Signing when these exist, and otherwise
# not at all, so SmartScreen warns about the installer. Secrets, of an Entra
# application that trusts this repository's tags (a federated credential,
# so no password is stored) and holds the Artifact Signing Certificate
# Profile Signer role:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Variables:
#   AZURE_SIGNING_ENDPOINT  the signing account's region, such as
#                           https://eus.codesigning.azure.net
#   AZURE_SIGNING_ACCOUNT   the Artifact Signing account's name
#   AZURE_SIGNING_PROFILE   the certificate profile's name
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - justfile
      - crates/viewer/bundle/**
      - crates/viewer/build.rs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS disk image
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0
      # Apple's steps for a runner: the certificate goes into a keychain
      # made for this job.
      # https://docs.github.com/en/actions/how-tos/deploy/deploy-to-third-party-platforms/sign-xcode-applications
      - name: Import the signing certificate
        if: github.event_name != 'pull_request' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          test -n "$identity"
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - run: just dmg
      - name: Notarize and staple
        if: env.CODESIGN_IDENTITY != '' && env.APPLE_API_KEY != ''
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/key.p8"
          dmg=$(ls target/release/bundle/*.dmg)
          # `--wait` returns once Apple has an answer, whatever it is.
          xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/key.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --wait --output-format json | tee "$RUNNER_TEMP/notary.json"
          rm "$RUNNER_TEMP/key.p8"
          grep -Eq '"status" *: *"Accepted"' "$RUNNER_TEMP/notary.json"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
      # The image as a person gets it: mounted, its app's signature
      # checked, and the binary inside run.
      - name: Check the disk image
        run: |
          dmg=$(ls target/release/bundle/*.dmg)
          volume=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | cut -f3)
          app="$volume/Strikebrain Viewer.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E "Authority|Signature|flags"
          "$app/Contents/MacOS/strikebrain-viewer" --version
          hdiutil detach "$volume" -quiet
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: target/release/bundle/*.dmg
          if-no-files-found: error

  linux:
    name: Linux packages
    # The oldest Ubuntu the runners offer, so the binary asks for the
    # oldest C library.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The libraries the app links, as in ci.yml.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig-dev \
            libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libvulkan1
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0
      - run: just linux-packages
      # The package as a person gets it: installed, and the binary run.
      - name: Check the packages
        run: |
          sudo apt-get install -y ./target/release/bundle/*.deb
          strikebrain-viewer --version
          tar -tzf target/release/bundle/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            target/release/bundle/*.tar.gz
            target/release/bundle/*.deb
          if-no-files-found: error

  windows:
    name: Windows packages
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      # Azure takes GitHub's token for this run in place of a password.
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0
      # Built before the login, whose token does not last a cold build.
      - run: cargo build --release --locked -p viewer
      - uses: azure/login@v3
        if: github.event_name != 'pull_request' && env.AZURE_CLIENT_ID != ''
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Microsoft's steps for SignTool: its plugin for Artifact Signing, and
      # a file that names the account. The plugin signs in as the login
      # above did.
      # https://learn.microsoft.com/azure/artifact-signing/how-to-signing-integrations
      - name: Set up signing
        if: github.event_name != 'pull_request' && env.AZURE_CLIENT_ID != ''
        env:
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget install Microsoft.ArtifactSigning.Client -x -OutputDirectory $env:RUNNER_TEMP
          $dlib = "$env:RUNNER_TEMP\Microsoft.ArtifactSigning.Client\bin\x64\Azure.CodeSigning.Dlib.dll"
          if (-not (Test-Path $dlib)) { throw "no signing plugin at $dlib" }
          $metadata = "$env:RUNNER_TEMP\metadata.json"
          @{
            Endpoint = $env:ENDPOINT
            CodeSigningAccountName = $env:ACCOUNT
            CertificateProfileName = $env:PROFILE
            ExcludeCredentials = @(
              'EnvironmentCredential', 'ManagedIdentityCredential', 'WorkloadIdentityCredential',
              'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json | Set-Content $metadata
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          $command = "`"$signtool`" sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib `"$dlib`" /dmdf `"$metadata`""
          "SIGNTOOL=$command" >> $env:GITHUB_ENV
      - run: just windows-packages
      # The packages as a person gets them: the installer run without its
      # pages, the installed binary run, then uninstalled; and the .zip
      # unpacked and its binary run. A signed build must be signed
      # throughout.
      - name: Check the packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $out = 'target\release\bundle'
          $setup = Get-Item "$out\*-setup.exe"
          Start-Process $setup -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          $app = "$env:LOCALAPPDATA\Programs\Strikebrain Viewer"
          Get-ChildItem $app | ForEach-Object Name
          # A windowed program's output reaches a pipe, not the console.
          $version = & "$app\strikebrain-viewer.exe" --version | Out-String
          $version
          if ($version -notmatch '^strikebrain-viewer \d') { throw 'the installed binary did not name its version' }
          (Get-Item "$app\strikebrain-viewer.exe").VersionInfo | Format-List ProductName, ProductVersion, FileDescription
          $signed = @($setup, (Get-Item "$app\strikebrain-viewer.exe"), (Get-Item "$app\unins000.exe"))
          Expand-Archive (Get-Item "$out\*.zip") "$env:RUNNER_TEMP\unzipped"
          $portable = Get-Item "$env:RUNNER_TEMP\unzipped\*\strikebrain-viewer.exe"
          & $portable --version | Out-String
          $signed += $portable
          $signed | ForEach-Object { Get-AuthenticodeSignature $_ } | Format-Table Status, Path
          if ($env:SIGNTOOL) {
            $signed | ForEach-Object {
              if ((Get-AuthenticodeSignature $_).Status -ne 'Valid') { throw "$_ is not signed" }
            }
          }
          Start-Process "$app\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if (Test-Path "$app\strikebrain-viewer.exe") { throw 'the uninstaller left the binary' }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            target/release/bundle/*.zip
            target/release/bundle/*-setup.exe
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Check the tag names the version built
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          test "v$version" = "$GITHUB_REF_NAME"
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      # A signed record that these files were built here, from this
      # commit: `gh attestation verify <file> -R <this repository>`.
      - uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --generate-notes
