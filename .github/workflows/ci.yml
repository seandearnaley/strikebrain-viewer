# Every gate on macOS, where the app is developed, and a build with the
# tests that run there on Linux and Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: just check (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # The versions `just setup` pins; see AGENTS.md, Tools.
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0,typos-cli@1.52.2,cargo-nextest@0.9.152,cargo-llvm-cov@0.9.2,cargo-shear@1.14.1,cargo-deny@0.22.0
      - run: just check

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A cold build of the optimized dependencies takes about 25 minutes on
    # these runners; the cache makes later runs short.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: build and test (Linux)
          # Windows builds the app and its tests but does not run them yet:
          # 15 of 490 fail there. See AGENTS.md, Known gaps.
          - os: windows-latest
            name: build (Windows)
            nextest: --no-run
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@v7
      # What GPUI Kit's installation guide lists for Ubuntu 24.04.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libasound2-dev libvulkan1
      # Kept when a test fails, so the next push does not rebuild GPUI.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo nextest run --locked --workspace --profile ci ${{ matrix.nextest }}
      # The app as it ships, without test-support. A check, since a second
      # build of GPUI would double the job.
      - run: cargo check --locked -p viewer --lib --bins
