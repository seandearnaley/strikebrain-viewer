# cargo-nextest: https://nexte.st/docs/configuration/reference/
nextest-version = { required = "0.9.115" }

[profile.default]
# Every test here finishes in milliseconds. Flag one as slow after 10 s and kill
# it after 30 s, so a hung UI test fails instead of stalling an unattended run.
slow-timeout = { period = "10s", terminate-after = 3, grace-period = "2s" }
# Backstop for the whole run.
global-timeout = "5m"
# A flaky test is a bug; never retry.
retries = 0

# `just check` uses this profile: run everything and report every failure once.
[profile.ci]
fail-fast = false
failure-output = "immediate-final"
